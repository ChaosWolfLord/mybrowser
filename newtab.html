<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1E1B18;
    color: #EDE4D8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; width: 100%; max-width: 520px; }
  .mark {
    font-size: 15px;
    color: #9C948A;
    margin-bottom: 28px;
    letter-spacing: 0.01em;
  }
  form {
    display: flex;
    margin-bottom: 36px;
  }
  input[type="text"] {
    flex: 1;
    background: #262220;
    border: 1px solid rgba(237,228,216,0.12);
    color: #EDE4D8;
    font-size: 15px;
    padding: 12px 16px;
    border-radius: 8px;
    outline: none;
  }
  input[type="text"]:focus { border-color: #C98A3E; }
  .links {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  a.link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 20px;
    border-radius: 10px;
    text-decoration: none;
    color: #EDE4D8;
    font-size: 13px;
    background: #262220;
    border: 1px solid rgba(237,228,216,0.08);
    width: 84px;
  }
  a.link:hover { border-color: rgba(237,228,216,0.24); }
  svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Where to?</div>
    <form action="https://www.google.com/search" method="GET">
      <input type="text" name="q" placeholder="Search Google or type a URL" autofocus>
    </form>
    <div class="links">
      <a class="link" href="https://mail.google.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C98A3E" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6l9 7 9-7"/></svg>
        Gmail
      </a>
      <a class="link" href="https://calendar.google.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="#6C9A93" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Calendar
      </a>
      <a class="link" href="https://drive.google.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7C93B0" stroke-width="1.6"><path d="M8 3h8l6 10-4 7H6l-4-7z"/><path d="M4 13h16"/></svg>
        Drive
      </a>
    </div>
  </div>
</body>
</html>
