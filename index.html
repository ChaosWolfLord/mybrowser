<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>My Browser</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <div class="titlebar">
    <button class="navbtn" id="back-btn" title="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="navbtn" id="fwd-btn" title="Forward">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="navbtn" id="reload-btn" title="Reload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 10-3 6.7M21 12v6h-6"/></svg>
    </button>

    <div class="addressbar">
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
      <input id="address-input" type="text" placeholder="Search Google or type a URL" spellcheck="false">
    </div>

    <button class="newtabbtn" id="new-tab-btn" title="New tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="sidebar-toggle" id="sidebar-toggle-btn" title="Toggle Google panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
  </div>

  <div class="tabstrip" id="tabstrip"></div>

  <div class="body">
    <div class="browser-pane" id="webview-container"></div>

    <div class="sidebar" id="sidebar">
      <div class="sidebar-tabs">
        <div class="sbtab active" data-app="gmail" title="Gmail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6l9 7 9-7"/></svg>
        </div>
        <div class="sbtab" data-app="calendar" title="Calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </div>
        <div class="sbtab" data-app="drive" title="Drive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3h8l6 10-4 7H6l-4-7z"/><path d="M4 13h16"/></svg>
        </div>
        <div class="sbtab" data-app="youtube" title="YouTube">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>
        </div>
        <div class="sbtab" data-app="assistant" title="Claude">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.2 6.8H21l-5.6 4 2.2 6.8L12 16.6l-5.6 4 2.2-6.8L3 9.8h6.8z"/></svg>
        </div>
      </div>
      <div class="sidebar-panels" id="sidebar-panels">
        <webview id="panel-gmail" class="active" src="https://mail.google.com" partition="persist:main" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"></webview>
        <webview id="panel-calendar" src="https://calendar.google.com" partition="persist:main" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"></webview>
        <webview id="panel-drive" src="https://drive.google.com" partition="persist:main" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"></webview>
        <webview id="panel-youtube" src="https://www.youtube.com" partition="persist:main" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"></webview>
        <webview id="panel-assistant" src="https://claude.ai" partition="persist:main" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"></webview>
      </div>
    </div>
  </div>

</div>
<script src="renderer.js"></script>
</body>
</html>
