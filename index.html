<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; form-action 'none'; base-uri 'none'; frame-src *">
<title>My Browser</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <div class="chrome">
  <div class="titlebar">
    <button class="navbtn" id="back-btn" title="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="navbtn" id="fwd-btn" title="Forward">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="navbtn" id="reload-btn" title="Reload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 10-3 6.7M21 12v6h-6"/></svg>
    </button>

    <div class="addressbar">
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
      <input id="address-input" type="text" placeholder="Search Google or type a URL" spellcheck="false">
      <div class="suggest" id="suggest"></div>
    </div>

    <button class="newtabbtn" id="new-tab-btn" title="New tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="navbtn" id="downloads-btn" title="Downloads (Ctrl+J)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg>
      <span class="dot" id="downloads-dot"></span>
    </button>
    <button class="sidebar-toggle" id="sidebar-toggle-btn" title="Toggle Google panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
    <button class="navbtn" id="menu-btn" title="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
    </button>
  </div>

  <div class="tabstrip" id="tabstrip"></div>
    <div class="loadbar" id="loadbar"><i></i></div>
  </div>

  <div class="body">
    <div class="browser-pane" id="webview-container">
      <div class="findbar" id="findbar">
        <input id="find-input" type="text" placeholder="Find in page" spellcheck="false">
        <span class="findcount" id="find-count"></span>
        <button class="findbtn" id="find-prev" title="Previous (Shift+Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
        </button>
        <button class="findbtn" id="find-next" title="Next (Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="findbtn" id="find-close" title="Close (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="overlay" id="history-overlay">
        <div class="overlay-head">
          <span class="overlay-title">History</span>
          <input id="history-search" type="text" placeholder="Search history" spellcheck="false">
          <button class="overlay-btn" id="history-clear">Clear all</button>
          <button class="overlay-btn" id="history-close">Close</button>
        </div>
        <div class="overlay-list" id="history-list"></div>
      </div>
      <div class="overlay" id="downloads-overlay">
        <div class="overlay-head">
          <span class="overlay-title">Downloads</span>
          <span class="overlay-spacer"></span>
          <button class="overlay-btn" id="downloads-clear">Clear finished</button>
          <button class="overlay-btn" id="downloads-close">Close</button>
        </div>
        <div class="overlay-list" id="downloads-list"></div>
      </div>
    </div>

    <div class="sidebar" id="sidebar">
      <div class="sidebar-resize" id="sidebar-resize" title="Drag to resize"></div>
      <div class="sidebar-tabs">
        <div class="sbtab active" data-app="gmail" title="Gmail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6l9 7 9-7"/></svg>
        </div>
        <div class="sbtab" data-app="calendar" title="Calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </div>
        <div class="sbtab" data-app="drive" title="Drive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3h8l6 10-4 7H6l-4-7z"/><path d="M4 13h16"/></svg>
        </div>
        <div class="sbtab" data-app="youtube" title="YouTube">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>
        </div>
        <div class="sbtab" data-app="assistant" title="Claude">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.2 6.8H21l-5.6 4 2.2 6.8L12 16.6l-5.6 4 2.2-6.8L3 9.8h6.8z"/></svg>
        </div>
        <div class="sbcollapse" id="sidebar-collapse" title="Collapse panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>
      <div class="sidebar-panels" id="sidebar-panels">
        <webview id="panel-gmail" class="active" data-src="https://mail.google.com" partition="persist:main"></webview>
        <webview id="panel-calendar" data-src="https://calendar.google.com" partition="persist:main"></webview>
        <webview id="panel-drive" data-src="https://drive.google.com" partition="persist:main"></webview>
        <webview id="panel-youtube" data-src="https://www.youtube.com" partition="persist:main"></webview>
        <webview id="panel-assistant" data-src="https://claude.ai" partition="persist:main"></webview>
      </div>
      <div class="sidebar-foot">
        <span class="footspacer"></span>
        <button class="zoombtn" id="zoom-out" title="Zoom out">&#8722;</button>
        <span class="zoomlabel" id="zoom-label" title="Click to reset">100%</span>
        <button class="zoombtn" id="zoom-in" title="Zoom in">+</button>
      </div>
    </div>
  </div>

  <div class="drag-shield" id="drag-shield"></div>

</div>
<script src="renderer.js"></script>
</body>
</html>
