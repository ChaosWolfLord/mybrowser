<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Source of icon.ico. Regenerate with: npx electron tools/make-icon.js
       The new tab page's three colour fields, condensed into an orb: the
       silhouette stays legible at 16px while the interior carries the
       gradient that makes it recognisably this browser at 256px. -->
  <defs>
    <clipPath id="tile"><rect width="256" height="256" rx="58"/></clipPath>
    <clipPath id="orb"><circle cx="128" cy="128" r="78"/></clipPath>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="19"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <linearGradient id="base" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#272019"/>
      <stop offset="1" stop-color="#120F0C"/>
    </linearGradient>

    <!-- Light from the top-left, as everywhere else in the app. -->
    <linearGradient id="rim" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#F7EEDF" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#F7EEDF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F7EEDF" stop-opacity="0.30"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.34" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#base)"/>

    <!-- A little of the same light spilling onto the tile itself. -->
    <g filter="url(#softer)" opacity="0.42">
      <circle cx="34" cy="24" r="70" fill="#C98A3E"/>
      <circle cx="236" cy="78" r="58" fill="#6C9A93"/>
      <circle cx="150" cy="252" r="60" fill="#8B7EC8"/>
    </g>

    <!-- The orb: dark well, three fields inside it, then a rim of light. -->
    <circle cx="128" cy="128" r="78" fill="#0E0B09"/>
    <g clip-path="url(#orb)">
      <g filter="url(#soft)">
        <circle cx="88" cy="80" r="58" fill="#F2A63F"/>
        <circle cx="198" cy="126" r="52" fill="#57AC9C"/>
        <circle cx="118" cy="210" r="60" fill="#9585DC"/>
      </g>
      <circle cx="128" cy="128" r="78" fill="url(#sheen)"/>
    </g>

    <circle cx="128" cy="128" r="78" fill="none" stroke="url(#rim)" stroke-width="3.5"/>
  </g>
</svg>
